slug: test_mob_articolare_semplificata
title: Test mobilita articolare semplificata
version: v1
locale: it

intro: |
  Autovalutazione rapida della mobilita articolare.
  Ogni voce va da 0 a 3.

scoring:
  enabled: true
  max_total: 27
  levels:
    - min: 0
      max: 9
      code: rosso
      label: Mobilita limitata
      interpretation: Mobilita limitata
      recommendation: Consigliata valutazione individuale
    - min: 10
      max: 18
      code: giallo
      label: Mobilita media
      interpretation: Mobilita media
      recommendation: Percorso di gruppo consigliato
    - min: 19
      max: 27
      code: verde
      label: Buona mobilita
      interpretation: Buona mobilita
      recommendation: Accesso a percorsi avanzati o mantenimento

